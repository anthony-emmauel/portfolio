# Netlify: continuous deployment from GitHub.
#   push to main → production (emmanuelanthony.site)
#   pull request → Deploy Preview
# Netlify detects Next.js and applies its Next.js runtime automatically
# (ISR for the home page's daily Medium refresh, image optimisation, redirects).

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Cover videos, posters and dashboard images don't change once published;
# a new version gets a new deploy. Cache them for a week at the edge and browser.
[[headers]]
  for = "/work/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/avatar/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
